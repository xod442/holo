[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length — not enforced (long strings/URLs in templates & routes)
    "E741",  # ambiguous variable name — pre-existing style (`l` for lab in list comps)
    "E402",  # module import not at top — pre-existing style in app/routes/labs.py
]

[tool.coverage.run]
source = ["app"]
omit = ["app/routes/__init__.py"]
