{% extends "base.html" %}
{% block title %}Sign in · HOLO{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Sign in</h1>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" autocomplete="off">
    <label>Email or username
      <input type="text" name="email" required autofocus autocomplete="off">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="off">
    </label>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
  // Never leave the password lingering in the field (incl. back/forward cache).
  (function () {
    function clearPassword() {
      document.querySelectorAll('input[type=password]').forEach(function (el) { el.value = ''; });
    }
    window.addEventListener('pageshow', clearPassword);
    document.addEventListener('DOMContentLoaded', clearPassword);
  })();
</script>
{% endblock %}
